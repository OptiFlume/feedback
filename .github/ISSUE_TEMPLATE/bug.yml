name: Bug report
description: Something in OptiFlume does not do what the docs say.
labels: ["bug", "needs-info"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. Please run `optiflume doctor --bundle` first and attach the file it saves to your Desktop; it holds no prompts, code, or names of your folders and files.
        Account or billing problems go to https://optiflume.ai/support, security issues to security@optiflume.ai.
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - Cursor
        - Claude Code (editor panel)
        - Claude Code (terminal)
        - Codex (editor panel)
        - Codex (terminal)
        - The console (optiflume.ai/console)
        - Install or update
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OptiFlume and macOS versions
      placeholder: "optiflume 1.3.0, macOS 15.1, Apple silicon"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead. Strip anything private.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: doctor
    attributes:
      label: Doctor bundle
      description: Drag the file `optiflume doctor --bundle` saved to your Desktop into this box.
